<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeonBotChat - 登录</title>
  <link rel="stylesheet" href="css/base.css?v=26.9.0">
  <link rel="stylesheet" href="css/accounts.css?v=26.9.0">
</head>
<body>
  <div id="loginPage" class="login-page">
    <div class="login-container">
      <div class="login-logo">
        <img src="icons/bot.svg" class="svg-icon" alt="NeonBotChat">
        <h1>NeonBotChat</h1>
      </div>
      
      <div class="saved-accounts" id="savedAccounts">
        <h3>选择账号登录</h3>
        <div class="account-list" id="accountList"></div>
      </div>
      
      <div class="divider"><span>或输入新账号</span></div>
      
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="loginAppid">AppID</label>
          <input type="text" id="loginAppid" placeholder="输入 AppID" required>
        </div>
        <div class="form-group">
          <label for="loginSecret">AppSecret</label>
          <input type="password" id="loginSecret" placeholder="输入 AppSecret" required>
        </div>
        <div id="loginError" class="error-message" role="alert" style="display:none;"></div>
        <button type="submit" class="btn-login" id="loginSubmit">登录</button>
      </form>
    </div>
  </div>
  
  <script src="js/accounts.js?v=26.9.0"></script>
  <script>
    const loginManager = new LoginManager();
    loginManager.init();
  </script>
</body>
</html>
