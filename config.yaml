# NeonBotChat 配置文件
# 复制为 config.yaml 并填入真实值

# AppID / AppSecret 已迁移到 WebUI 的机器人账号库；这里不再保存机器人凭据。
webui-port: 8082          # WebUI 端口，默认 8080
enable-public: true       # true = 0.0.0.0 允许外网访问
webui-password: ""         # 访问密码，留空则不启用密码保护
developerMode: False        # True 启用开发者模式（显示自定义消息等）

# ── 图床服务器连接（可选，用于富媒体发送）──
# 图床本身的完整配置在 file_server/config.yaml
file-server:
  public-url: "http://192.168.100.110:8099"  # 图床服务器的公网访问地址
  token: "123456789@@@"
